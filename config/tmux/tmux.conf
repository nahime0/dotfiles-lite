# Conservative terminal setting for broad server compatibility.
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',xterm-kitty:Tc'

set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s escape-time 0

unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Keep Ctrl+h/j/k/l inside Vim and use them to move across tmux panes elsewhere.
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Vi-style copy mode with system-independent tmux buffers.
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-left ' #S '
set -g status-right ' %Y-%m-%d %H:%M '
