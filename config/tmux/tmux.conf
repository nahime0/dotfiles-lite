# Conservative terminal setting for broad server compatibility.
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',xterm-kitty:Tc'

set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s escape-time 0

unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Keep Ctrl+h/j/k/l inside Vim and use them to move across tmux panes elsewhere.
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Vi-style copy mode with system-independent tmux buffers.
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Nord status line: session on the left, clear window state in the middle and
# the remote host plus clock on the right. No plugin or patched font required.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style 'fg=#D8DEE9,bg=#2E3440'

set -g status-left '#[fg=#2E3440,bg=#81A1C1,bold] #S #[fg=#4C566A,bg=#2E3440,nobold] │'
set -g status-right '#{?client_prefix,#[fg=#2E3440]#[bg=#EBCB8B]#[bold] PREFIX #[fg=#4C566A]#[bg=#2E3440]#[nobold]│ ,}#{?window_zoomed_flag,#[fg=#2E3440]#[bg=#B48EAD]#[bold] ZOOM #[fg=#4C566A]#[bg=#2E3440]#[nobold]│ ,}#[fg=#81A1C1,bold] #h #[fg=#4C566A,nobold]· #[fg=#D8DEE9]%d %b #[fg=#4C566A]· #[fg=#A3BE8C]%H:%M '

setw -g window-status-separator '#[bg=#2E3440] '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#D8DEE9,bg=#3B4252'
setw -g window-status-current-style 'fg=#2E3440,bg=#88C0D0,bold'
setw -g window-status-activity-style 'fg=#2E3440,bg=#EBCB8B,bold'
setw -g window-status-bell-style 'fg=#D8DEE9,bg=#BF616A,bold'
setw -g monitor-activity on
set -g visual-activity off

set -g message-style 'fg=#2E3440,bg=#88C0D0,bold'
set -g message-command-style 'fg=#2E3440,bg=#EBCB8B,bold'
setw -g mode-style 'fg=#2E3440,bg=#A3BE8C,bold'
